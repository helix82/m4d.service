apiVersion: v1
kind: Service
metadata:
  labels:
    app: synapi
  name: synapi
  namespace: ocode
spec:
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
    - name: "8000"
      port: 8000
      targetPort: 8000
    - name: "5005"
      port: 5005
      targetPort: 5005
  selector:
    app: synapi
status:
  loadBalancer: {}
