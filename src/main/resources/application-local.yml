server:
  port: 8051
web:
  cors:
    allow-origin: "*"
    allow-methods: "*"
    allow-headers: "Authorization,*"
    max-age: 5
  server:
    uri: http://localhost
logging:
  level:
    su.opencode.digsigcik.synapi: DEBUG
---

spring:
  application:
    name: m4d-service
  config.activate.on-profile: local
  datasource:
#    url: jdbc:postgresql://localhost:5434/localsepdb
#    username: root
#    password: root
#    driver-class-name: org.postgresql.Driver

    url: jdbc:h2:mem:testdb1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
#      database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
#  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      schema-locations: classpath*:db/h2/schema.sql
      data-locations: classpath*:db/h2/data.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

tls:
  ca:
    uri: https://192.168.0.53:4433/acme/acme/directory
  account:
    name: acme.account.name
    mail: acme@account.mail
    key: acme.account.key
  max_attempts: 50
  external_acknowledge: false

cryptopro:
  svs:
    uri: https://keylab/vs/api
#    uri: https://dss.cryptopro.ru/verify/rest/api

features:
  show-ses-certificates: false
  ses-certificates-age: 100
  ses-certificates-issuer: "CN=SEP Self-Signed Certificate"

#Swagger
springdoc:
  api-docs:
    # It should be off for PROD
    enabled: true
  server:
    url: ${SWAGGER_URL:http://localhost:8051}
    token-uri: ${KEYCLOAK_SWAGGER_TOKEN_URI:http://localhost:8080/auth/realms/USERS/protocol/openid-connect/token}

m4d:
  handbook:
    uri: http://localhost:8080/api/v1