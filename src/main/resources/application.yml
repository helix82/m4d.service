
spring:
  profiles:
    default: local
    active: "@spring.profiles.active@"
  datasource:
    url: jdbc:postgresql://localhost:5432/localsepdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

#    url: jdbc:h2:mem:testdb
#    driver-class-name: org.h2.Driver
#    username: sa
#    password:

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
#    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
web:
  cors:
    allow-origin: "*"
    allow-methods: OPTIONS, HEAD, POST, PUT, GET, DELETE
  server:
    uri: http://localhost
logging:
  level:
    su.opencode.digsigcik.synapi: DEBUG
---

spring:
  config.activate.on-profile: local
#  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      schema-locations: classpath*:db/h2/schema.sql
      data-locations: classpath*:db/h2/data.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    su.opencode.digsigcik.synapi: TRACE

jwt:
  secret: $2a$12$HmLdYNemJ6B6tFTC9InU.OoF5hB3w.3109Pb4sc.Fthvm4X3TZz4i
  lifetime: 40m

tls:
  ca:
    uri: https://192.168.0.53:4433/acme/acme/directory
  account:
    name: acme.account.name
    mail: acme@account.mail
    key: acme.account.key
  max_attempts: 50
  external_acknowledge: false

cryptopro:
  svs:
    uri: https://keylab/vs/api
#    uri: https://dss.cryptopro.ru/verify/rest/api

features:
  show-ses-certificates: true
  ses-certificates-age: 100
  ses-certificates-issuer: "CN=SEP Self-Signed Certificate"
