server:
  port: ${SERVER_PORT:8051}

spring:
  application:
    name: ${APPLICATION_NAME:m4d}
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/m4d_scheme}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog_master.yml
  #Security properties
  security:
    oauth2:
      client:
        provider:
          rpd:
            authorization-uri: ${RPD_AUTHORIZATION_URI:https://sso.rpd.zk.test.st/realms/test/protocol/openid-connect/auth}
      resourceserver:
        jwt:
         issuer-uri: ${OAUTH2_ISSUER_URL:https://sso.rpd.zk.test.st/realms/test}


  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# TODO: отключена, поскольку в поставку заказчику на данный релиз не входит, позже включить
