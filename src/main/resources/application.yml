logging:
  file:
    name: ${LOGGING_FILE_NAME:m4d.log}
    path: ${LOGGING_FILE_PATH:log/m4d}
  level:
    su.opencode.digsigcik.synapi: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.client: WARN
    org.springframework.web.servlet.mvc.method.annotation: WARN
    su.opencode.digsigcik.specification: DEBUG    # pagination
    su.opencode.digsigcik.synapi.service: DEBUG

web:
  cors:
    allow-origin: "*"
    allow-methods: OPTIONS, HEAD, POST, PUT, GET, DELETE
    allow-headers: "*"
    max-age: 5
  security:
    resource-access: ${RESOURCE_ACCESS:sep}
    lifespan-cache: ${RPD_LIFESPAN_CACHE:1440}
    refresh-time-cache: ${RPD_REFRESH_TIME_CACHE:1350}
    connection-timeout: ${RPD_CONNECTION_TIMEOUT:10000}
    read-timeout: ${RPD_READ_TIMEOUT:10000}
    white-list-all-methods: ${WHITE_LIST:/v3/api-docs/**,/configuration/ui,/swagger-resources/**,/configuration/security,/swagger-ui.html,/swagger-ui/**,/webjars/**,/.well-known/acme-challenge/**,/favicon.ico,/actuator,/actuator/health,/actuator/info,/actuator/env,/actuator/beans,/actuator/metrics,/actuator/loggers,/actuator/mappings,/api/v1/m4d/upload-result-sending-to-rr,/api/v1/m4d/status,/api/v1/m4d/revoke/upload-result-sending-to-rr}
    trust-all: ${DISABLE_TLS_CHECK:true}
---

spring:
#  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  liquibase:
    contexts: test

#Swagger
springdoc:
  api-docs:
    # It should be off for PROD
    enabled: true
  server:
    url: ${SWAGGER_URL:http://localhost:8051}
    token-uri: ${RPD_SWAGGER_TOKEN_URI:https://sso.rpd.zk.test.st/realms/test/protocol/openid-connect/token}
  show-actuator: true

synapi:
  base-uri: ${SYNAPI_BASE_URI:https://sp.dev.essocode.ru}
  notification:
    send-uri: ${NOTIFICATION_SEND_URI:http://localhost:8081/api/v1/notifications/send}
  container:
    get-part:
      uri: ${CONTAINER_PART_URI:http://localhost:8081/api/v1/container/get-part}
#      uri: ${CONTAINER_PART_URI:https://sp.dev.essocode.ru/api/v1/container/get-part}
  user-certs:
    search-by-inn-uri: ${USER_CERTS_SEARCH_BY_INN_URI:https://sp.dev.essocode.ru/api/v1/user/user-certificate/search-by-inn}
    me-uri: ${USER_CERTS_ME_URI:https://sp.dev.essocode.ru/api/v1/user/user-certificate}

m4d:
  soul: ${M4D_SOUL:"}
  xml-version-format: ${M4D_XML_VERSION_FORMAT:EMCHD_1}
  revoke:
    xml-version-format: ${M4D_REVOKE_XML_VERSION_FORMAT:001}

confirm:
  version-format: ${CONFIRM_VERSION_FORMAT:ПодтвФНС003}
  legal-entity:
    id: ${CONFIRM_LEGAL_ENTITY_ID:de8d2875-283a-4f59-9246-e1879e256bc2}
    name: ${CONFIRM_LEGAL_ENTITY_NAME:ЦЕНТРАЛЬНАЯ ИЗБИРАТЕЛЬНАЯ КОМИССИЯ РОССИЙСКОЙ ФЕДЕРАЦИИ}
    trade-name: ${CONFIRM_LEGAL_ENTITY_TRADE_NAME:ЦИК РФ}
    inn: ${CONFIRM_LEGAL_ENTITY_INN:7710010990}
    ogrn: ${CONFIRM_LEGAL_ENTITY_OGRN:1027700466640}
  operator:
    adr-nod: ${CONFIRM_OPERATOR_ADR_NOD:4M2EFnszPAT1yr45SgWVDLxfYCa4AYvDGns}
    product-url: ${CONFIRM_OPERATOR_PRODUCT_URL:sep.cik}
    product-version: ${CONFIRM_OPERATOR_PRODUCT_VERSION:sep.cik 2.11}
  m4d:
    type: ${CONFIRM_M4D_TYPE:ПодтвДовер}
  revoke:
    type: ${CONFIRM_REVOKE_TYPE:ПодтвЗаявлОтмена}

autosign:
  user-login: ${AUTOSIGN_USER_LOGIN:pep}
  pincode: ${AUTOSIGN_PINCODE:1234}
  is-detached: ${AUTOSIGN_IS_DETACHED:true}
  sig-type: ${AUTOSIGN_SIG_TYPE:CAdES_BES}

ref-book:
  organization-find-by-inn:
    uri: ${ORGANIZATION_FIND_BY_INN_URI:https://ref-book.dev.essocode.ru/api/v1/ref-book/organization/inn}

# Временное решение до полноценного внедрения kafka
audit:
  #url: ${AUDIT_URL:https://log.dev.essocode.ru/api/v1/audit/external}
  url: ${AUDIT_URL:http://localhost:8055/api/v1/audit/external}
  default-user: 'Администратор МЧД'

cryptopro:
  proxy-service: ${CRYPTO_PROXY_SIGN_URL:https://cp.dev.essocode.ru/api/v1/sign/cades/as-user}

pvv:
  fns-send-registration-request-m4d: ${FNS_SEND_REGISTRATION_REQUEST_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/rrm4d/send-registration-request-file}
  fns-send-status-request-m4d: ${FNS_SEND_STATUS_REQUEST_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/rrm4d/send-status-request-json}
  fns-send-revoke-request-m4d: ${FNS_SEND_REVOKE_REQUEST_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/rrm4d/send-revocation-request-file}

#actuator
management:
  endpoint:
    health:
      group:
        readiness:
          include: db, readinessState
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:*}

scheduler:
  interval: 'PT1H'
  delay15: 'PT15S'
  delay30: 'PT30S'
  delay45: 'PT45S'

