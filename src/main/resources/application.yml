spring:
  profiles:
    default: local
    active: "@spring.profiles.active@"
  datasource:
#    url: jdbc:postgresql://localhost:5434/localsepdb
#    username: root
#    password: root
#    driver-class-name: org.postgresql.Driver

    url: jdbc:h2:mem:testdb1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  #Security properties
  security:
    oauth2:
      client:
        provider:
          rpd:
            authorization-uri: ${RPD_AUTHORIZATION_URI:https://sso.rpd.zk.test.st/realms/test/protocol/openid-connect/auth}
      resourceserver:
        jwt:
         issuer-uri: ${OAUTH2_ISSUER_URL:https://sso.rpd.zk.test.st/realms/test}


  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
#    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  #Kafka settings
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS_LIST_URL:localhost:29092,localhost:39092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      batch-size: 32768
      compression-type: lz4
      properties:
        linger.ms: 1000
      retries: 3
    #Здесь указываются топики, которые вы хотите использовать
    topics:
      test: TEST

logging:
  level:
    org.springframework.web: DEBUG
    org.apache.http: DEBUG
    org.apache.http.wire: TRACE

server:
  port: 8051
web:
  cors:
    allow-origin: "*"
    allow-methods: "*"
    allow-headers: "Authorization,*"
    max-age: 5
  server:
    uri: http://localhost
---

spring:
  config.activate.on-profile: local
#  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      schema-locations: classpath*:db/h2/schema.sql
      data-locations: classpath*:db/h2/data.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

tls:
  ca:
    uri: https://192.168.0.53:4433/acme/acme/directory
  account:
    name: acme.account.name
    mail: acme@account.mail
    key: acme.account.key
  max_attempts: 50
  external_acknowledge: false

cryptopro:
  svs:
    uri: https://keylab/vs/api
#    uri: https://dss.cryptopro.ru/verify/rest/api

features:
  show-ses-certificates: true
  ses-certificates-age: 100
  ses-certificates-issuer: "CN=SEP Self-Signed Certificate"

#Swagger
springdoc:
  api-docs:
    # It should be off for PROD
    enabled: true
  server:
    url: ${SWAGGER_URL:http://localhost:8051}
    token-uri: ${RPD_SWAGGER_TOKEN_URI:https://sso.rpd.zk.test.st/realms/test/protocol/openid-connect/token}

m4d:
  handbook:
    uri: https://sp.essocode.ru/api/v1