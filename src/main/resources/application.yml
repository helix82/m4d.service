spring:
  profiles:
    default: local
    active: "@spring.profiles.active@"
  datasource:
    url: jdbc:postgresql://localhost:5432/localsepdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
web:
  cors:
    allow-origin: "*"
    allow-methods: OPTIONS, HEAD, POST, PUT
logging:
  level:
    su.opencode.digsigcik.synapi: DEBUG
---
spring:
  config.activate.on-profile: local
logging:
  level:
    su.opencode.digsigcik.synapi: TRACE

