#        linger.ms: 1000
#      retries: 3
#    #Здесь указываются топики, которые вы хотите использовать
#    topics:
#      test: TEST

logging:
  level:
    org.springframework.web: DEBUG
    org.apache.http: DEBUG
    org.apache.http.wire: TRACE

web:
  cors:
    allow-origin: "*"
    allow-methods: OPTIONS, HEAD, POST, PUT, GET, DELETE
    allow-headers: "*"
    max-age: 5
  security:
    resource-access: ${RESOURCE_ACCESS:sep}
    lifespan-cache: ${RPD_LIFESPAN_CACHE:1440}
    refresh-time-cache: ${RPD_REFRESH_TIME_CACHE:1350}
    connection-timeout: ${RPD_CONNECTION_TIMEOUT:10000}
    read-timeout: ${RPD_READ_TIMEOUT:10000}
    white-list-all-methods: ${WHITE_LIST:/v3/api-docs/**,/configuration/ui,/swagger-resources/**,/configuration/security,/swagger-ui.html,/swagger-ui/**,/webjars/**,/.well-known/acme-challenge/**,/favicon.ico,/actuator,/actuator/health,/actuator/info,/actuator/env,/actuator/beans,/actuator/metrics,/actuator/loggers,/actuator/mappings,/api/v1/m4d/upload-result-sending-to-rr,/api/v1/m4d/status,/api/v1/m4d/revoke/upload-result-sending-to-rr}
    trust-all: ${DISABLE_TLS_CHECK:true}
---

spring:
  application:
    name: m4d-service
#  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  liquibase:
    contexts: test

#Swagger
springdoc:
  api-docs:
    # It should be off for PROD
    enabled: true
  server:
    url: ${SWAGGER_URL:http://localhost:8051}
    token-uri: ${RPD_SWAGGER_TOKEN_URI:https://sso.rpd.zk.test.st/realms/test/protocol/openid-connect/token}
  show-actuator: true

synapi:
  user-certs-me:
    uri: ${USER_CERTS_ME_URI:https://sp.dev.essocode.ru/api/v1/user-certificate/me}

  container:
    get-part:
      uri: ${CONTAINER_PART_URI:http://localhost:8081/api/v1/container/get-part}
#      uri: ${CONTAINER_PART_URI:https://sp.dev.essocode.ru/api/v1/container/get-part}

m4d:
  handbook:
    uri: ${M4D_HANDBOOK_URI:https://sp.dev.essocode.ru/api/v1}
  api_rr_fns:
    uri: ${M4D_API_RR_FNS_URI:https://operator.cprr-it.weintegrator.com/api/v0}
  soul: ${M4D_SOUL:"}

ref-book:
  organization-find-by-inn:
    uri: ${ORGANIZATION_FIND_BY_INN_URI:https://ref-book.dev.essocode.ru/api/v1/ref-book/organization/inn}

# Временное решение до полноценного внедрения kafka
audit:
  #url: ${AUDIT_URL:https://log.dev.essocode.ru/api/v1/audit/external}
  url: ${AUDIT_URL:http://localhost:8055/api/v1/audit/external}
  default-user: 'Администратор МЧД'

cryptopro:
  proxy-service: ${CRYPTO_PROXY_SIGN_URL:https://cp.dev.essocode.ru/api/v1/sign/cades/as-user}

autosign:
  user-login: ${AUTOSIGN_USER_LOGIN:pep}
  pincode: ${AUTOSIGN_PINCODE:1234}
  is-detached: ${AUTOSIGN_IS_DETACHED:true}
  sig-type: ${AUTOSIGN_SIG_TYPE:CAdES_BES}

pvv:
  use-gost: true
  ping-tsl: ${PVV_ADAPTER_TSL_PING_URI:https://pvv-adapter-zk.dev.essocode.ru/api/v1/tsl}
  fns-send-registration-request-m4d: ${FNS_SEND_REGISTRATION_REQUEST_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/manual/rrm4d/send-registration-request-file}
  fns-send-status-request-m4d: ${FNS_SEND_STATUS_REQUEST_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/manual/rrm4d/send-status-request-json}
  fns-send-revoke-request-m4d: ${FNS_SEND_REVOKE_REQUEST_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/manual/rrm4d/send-revocation-request-file}
  fns-receive-response-m4d: ${FNS_RECEIVE_RESPONSE_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/manual/inbox/}
  fns-receive-json-response-m4d: ${FNS_RECEIVE_JSON_RESPONSE_M4D_URI:https://pvv-adapter.rel.zk.essocode.ru/api/v1/manual/inbox/json/}

#actuator
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:*}

scheduler:
  interval: 'PT60S'
  delay15: 'PT15S'
  delay30: 'PT30S'
  delay45: 'PT45S'