
spring:
  profiles:
    default: local
    active: "@spring.profiles.active@"
  datasource:
    url: jdbc:postgresql://localhost:5432/localsepdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

#    url: jdbc:h2:mem:testdb
#    driver-class-name: org.h2.Driver
#    username: sa
#    password:

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
#    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
web:
  cors:
    allow-origin: "*"
    allow-methods: OPTIONS, HEAD, POST, PUT, GET, DELETE
logging:
  level:
    su.opencode.digsigcik.synapi: DEBUG
---

spring:
  config.activate.on-profile: local
#  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

logging:
  level:
    su.opencode.digsigcik.synapi: TRACE

