server:
  port: 80

web:
  cors:
    allow-origin: "*"
    allow-methods: OPTIONS, HEAD, POST, PUT, GET, DELETE
  server:
    uri: http://synapi.local
logging:
  level:
    su.opencode.digsigcik.synapi: DEBUG
---

spring:
  config.activate.on-profile: k3s-local
  datasource:
    #    url: jdbc:postgresql://localhost:5432/localsepdb
    #    username: root
    #    password: root
    #    driver-class-name: org.postgresql.Driver

    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
#  TODO: remove h2 console
  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true
      enabled: true


  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    #database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      schema-locations: classpath*:db/h2/schema.sql
      data-locations: classpath*:db/h2/data.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    su.opencode.digsigcik.synapi: TRACE

jwt:
  secret: $2a$12$HmLdYNemJ6B6tFTC9InU.OoF5hB3w.3109Pb4sc.Fthvm4X3TZz4i
  lifetime: PT4320H

tls:
  ca:
    uri: https://step-certificates.step-certificates.svc.cluster.local/acme/acme/directory
  account:
    name: acme.account.name
    mail: acme@account.mail
    key: acme.account.key
  max_attempts: 50
  external_acknowledge: false

cryptopro:
  svs:
    uri: https://keylab/vs/api

features:
  show-ses-certificates: false
  ses-certificates-age: 100
  ses-certificates-issuer: "CN=SEP Self-Signed Certificate"
