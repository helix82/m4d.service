openapi: 3.0.3 # TODO: upgrade to v3.1 as soon as openapi-codegen add support for v3.1
info:
  title: SynAPI schema
  description: SynAPI schema
  version: 0.0.3
servers:
  - url: '{protocol}://cik-sep.o-code.ru:{port}/api/v1'
    description: Development server
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      port:
        enum:
          - '8080'
          - '8443'
        default: '8080'
paths:
  /create-pdf-container:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sourceFile, sourceSig, createSigStamp]
              properties:
                sourceFile:
                  type: string
                  format: binary
                  description: Signed PDF payload
                sourceSig:
                  type: string
                  format: binary
                  description: Signature data
                createSigStamp:
                  type: boolean
                  description: Should signature stamp be created and added to the container
                sigStampPosition:
                  $ref: "#/components/schemas/StampPosition"
      responses:
        200:
          description: DSCP Container created successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Raw bytes of created DSCP container
        400:
          description: Invalid request
  /update-pdf-container-regdata:
    put:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [container. regData]
              properties:
                container:
                  type: string
                  format: binary
                  description: DSCP container to update
                regData:
                  $ref: "#/components/schemas/RegistrationData"
      responses:
        200:
          description: DSCP Container updated successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: DSCP container
        400:
          description: Invalid request
  /get-container-data:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ container, selectors ]
              properties:
                container:
                  type: string
                  format: binary
                  description: DSCP container to update
                selectors:
                  type: array
                  items:
                    $ref: "#/components/schemas/ContainerSelector"
                reverify:
                  type: boolean
                  default: false
                  description: Verify signatures affecting selected data again (not persistent)
      responses:
        200:
          description: Selected container data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerData"
        400:
          description: Invalid request
  /get-container-part:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ container, selector ]
              properties:
                container:
                  type: string
                  format: binary
                  description: DSCP container to update
                selector:
                  $ref: "#/components/schemas/ContainerSelector"
                reverify:
                  type: boolean
                  default: false
                  description: Verify signatures affecting selected data again (not persistent)
      responses:
        200:
          description: Selected part of the container data, Content-Type actually depends on the params
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Selected data
        400:
          description: Invalid request

components:
  schemas:
    StampPosition:
      description: Position of the stamp
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          description: A page to put a stamp on; last page of document by default
        topLeftX:
          type: integer
          description: x-offset from top left corner, in mm; bottomRightX-width by default
        topLeftY:
          type: integer
          description: y-offset from top left corner, in mm; bottomRightY-height by default
    RegistrationData:
      description: Document registration data
      type: object
      required: [number, date]
      properties:
        number:
          type: string
          description: Document registration number
        date:
          type: string
          description: Date and time of document registration, e.g. '2024-03-25T16:15:30+04:00'
          format: date-time
    ContainerSelector:
      type: object
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/ContainerSelectorCode"

    ContainerSelectorCode:
      type: ContainerSelectorCode
    ContainerData:
      description: Keys are ContainerSelectorCode variants and values are base64 encoded files
      type: object
      additionalProperties:
        $ref: "#/components/schemas/ContainerPart"
    ContainerPart:
      description: Part of the container
      type: object
      required: [contentType, data]
      properties:
        contentType:
          type: string
          description: MIME type
        fileName:
          type: string
          description: File name
        data:
          type: string
          format: byte
