apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: synapi
  name: synapi
  namespace: ocode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapi
  template:
    metadata:
      labels:
        app: synapi
    spec:
      containers:
        - image: nexus.essocode.ru:5000/ess/synapi:master
          command:
            - java
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
            - -Dspring.profiles.active=k8s
            - -Xms2G
            - -Xmx64G
            - -XX:+UseG1GC
            - -XX:MinHeapFreeRatio=10
            - -XX:MaxHeapFreeRatio=30
            - -jar
            - synapi-0.0.1-SNAPSHOT.jar
          name: synapi
          ports:
            - containerPort: 8080
            - containerPort: 8000
            - containerPort: 5005
          resources: {}
          volumeMounts:
            - mountPath: /out
              name: synapi-claim0
      restartPolicy: Always
      volumes:
        - name: synapi-claim0
          persistentVolumeClaim:
            claimName: synapi-claim0
status: {}
