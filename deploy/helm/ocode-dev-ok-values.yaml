tlsConfig:
  name: tls-config-m4d

scriptConfig:
  name: script-config-m4d

nodeSelector:
  kubernetes.io/hostname: sep-1

jvmOptions:
  xms: 512m
  xmx: 750m
  gc: "-XX:+UseG1GC"
  minHeapFreeRatio: 10
  maxHeapFreeRatio: 30
  portJMX: 9010
  authenticateJMX: false
  sslJMX: false
  hostnameJMX: localhost
  localOnlyJMX: false
  timezone: UTC
  encoding: UTF-8
  logFilePath: /var/log/pep
  logFileName: m4d-dev-ok.log

jarFile: m4d-0.0.1-SNAPSHOT.jar

env:
  SPRING_DATASOURCE_URL: SPRING_DATASOURCE_URL
  SPRING_DATASOURCE_USERNAME: SPRING_DATASOURCE_USERNAME
  SPRING_DATASOURCE_PASSWORD: SPRING_DATASOURCE_PASSWORD
  RPD_AUTHORIZATION_URI: RPD_AUTHORIZATION_URI
