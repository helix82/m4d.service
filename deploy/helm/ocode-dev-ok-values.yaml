  CONFIRM_LEGAL_ENTITY_ID: CONFIRM_LEGAL_ENTITY_ID
  CONFIRM_LEGAL_ENTITY_NAME: CONFIRM_LEGAL_ENTITY_NAME
  CONFIRM_LEGAL_ENTITY_TRADE_NAME: CONFIRM_LEGAL_ENTITY_TRADE_NAME
  CONFIRM_LEGAL_ENTITY_INN: CONFIRM_LEGAL_ENTITY_INN
