namespace: dev-ok

image:
  repository: nexus.essocode.ru/ess/m4d
  tag: "{{.tag}}"
  libericaImage:
    repository: nexus.essocode.ru/bellsoft/liberica-openjdk-debian
    tag: "11"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8051
  targetPort: 8051
  portJMX: 9010
  targetPortJMX: 9010

replicaCount: 1

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    ingress.kubernetes.io/ssl-redirect: "true"
  tlsEnabled: true  # New parameter to control TLS
  hosts:
    - host: m4d.dev.ok.essocode.ru
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: m4d-dev-tls
      hosts:
        - m4d.dev.ok.essocode.ru

