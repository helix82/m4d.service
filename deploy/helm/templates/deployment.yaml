apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  minReadySeconds: 60
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- range .Values.hostAliases }}
        - ip: "{{ .ip }}"
          hostnames:
            {{- range .hostnames }}
            - "{{ . }}"
            {{- end }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Values.appName }}-dev
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          resources:
            requests:
              cpu: {{ .Values.deployment.container.requests.cpu }}
              memory: {{ .Values.deployment.container.requests.memory }}
            limits:
              cpu: {{ .Values.deployment.container.limits.cpu }}
              memory: {{ .Values.deployment.container.limits.memory }}
          command:
            - java
            - "-Xms{{ .Values.jvmOptions.xms }}"
            - "-Xmx{{ .Values.jvmOptions.xmx }}"
            - "{{ .Values.jvmOptions.gc }}"
            - "-Duser.timezone={{ .Values.jvmOptions.timezone }}"
            - "-Dfile.encoding={{ .Values.jvmOptions.encoding }}"
            - "-Dcom.sun.management.jmxremote"
            - "-Dcom.sun.management.jmxremote.port={{ .Values.jvmOptions.portJMX }}"
            - "-Dcom.sun.management.jmxremote.authenticate={{ .Values.jvmOptions.authenticateJMX }}"
            - "-Dcom.sun.management.jmxremote.ssl={{ .Values.jvmOptions.sslJMX }}"
            - "-Djava.rmi.server.hostname={{ .Values.jvmOptions.hostnameJMX }}"
            - "-Dcom.sun.management.jmxremote.local.only={{ .Values.jvmOptions.localOnlyJMX }}"
            - "-XX:MinHeapFreeRatio={{ .Values.jvmOptions.minHeapFreeRatio }}"
            - "-XX:MaxHeapFreeRatio={{ .Values.jvmOptions.maxHeapFreeRatio }}"
            - -jar
            - "{{ .Values.jarFile }}"
          ports:
            - containerPort: {{ .Values.service.port }}
            - containerPort: {{ .Values.service.portJMX }}
          env:
            - name: OAUTH2_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.OAUTH2_ISSUER_URL }}
            - name: RPD_AUTHORIZATION_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_AUTHORIZATION_URI }}
            - name: RPD_SWAGGER_TOKEN_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_SWAGGER_TOKEN_URI }}
            - name: SWAGGER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SWAGGER_URL }}
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_URL }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_USERNAME }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_PASSWORD }}
            - name: SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SERVER_PORT }}
            - name: KAFKA_BROKERS_LIST_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.KAFKA_BROKERS_LIST_URL }}
            - name: AUDIT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUDIT_URL }}
            - name: M4D_HANDBOOK_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.M4D_HANDBOOK_URI }}
            - name: RESOURCE_ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RESOURCE_ACCESS }}
            - name: RPD_LIFESPAN_CACHE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_LIFESPAN_CACHE }}
            - name: RPD_REFRESH_TIME_CACHE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_REFRESH_TIME_CACHE }}
            - name: RPD_CONNECTION_TIMEOUT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_CONNECTION_TIMEOUT }}
            - name: RPD_READ_TIMEOUT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_READ_TIMEOUT }}
            - name: DISABLE_TLS_CHECK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.DISABLE_TLS_CHECK }}
            - name: USER_CERTS_ME_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.USER_CERTS_ME_URI }}
            - name: CONTAINER_PART_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONTAINER_PART_URI }}
            - name: CONTAINER_PART_JSON_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONTAINER_PART_JSON_URI }}
            - name: M4D_API_RR_FNS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.M4D_API_RR_FNS_URI }}
            - name: CONTAINER_CREATE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONTAINER_CREATE_URI }}
            - name: ORGANIZATION_CREATE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.ORGANIZATION_CREATE_URI }}
            - name: ORGANIZATION_FIND_BY_INN_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.ORGANIZATION_FIND_BY_INN_URI }}
            - name: M4D_SOUL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.M4D_SOUL }}
            - name: AUTOSIGN_USER_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_USER_LOGIN }}
            - name: AUTOSIGN_PINCODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_PINCODE }}
            - name: AUTOSIGN_IS_DETACHED
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_IS_DETACHED }}
            - name: AUTOSIGN_SIG_TYPE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_SIG_TYPE }}
            - name: FNS_SEND_REGISTRATION_REQUEST_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.FNS_SEND_REGISTRATION_REQUEST_M4D_URI }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
