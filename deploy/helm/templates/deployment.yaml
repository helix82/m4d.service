apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  minReadySeconds: 60
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- range .Values.hostAliases }}
        - ip: "{{ .ip }}"
          hostnames:
            {{- range .hostnames }}
            - "{{ . }}"
            {{- end }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: setup-certs
          image: "{{ .Values.image.libericaImage.repository }}:{{ .Values.image.libericaImage.tag }}"
          command: [ "/bin/sh", "/scripts/setup-certs.sh" ]
          volumeMounts:
            - name: tls-volume
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: workdir
              mountPath: /workdir
            - name: setup-script
              mountPath: /scripts
      containers:
        - name: {{ .Values.appName }}-dev
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          resources:
            requests:
              cpu: {{ .Values.deployment.container.requests.cpu }}
              memory: {{ .Values.deployment.container.requests.memory }}
            limits:
              cpu: {{ .Values.deployment.container.limits.cpu }}
              memory: {{ .Values.deployment.container.limits.memory }}
          command: [ "/bin/sh", "/scripts/start-app.sh" ]
          volumeMounts:
            - name: workdir
              mountPath: /workdir
            - name: setup-script
              mountPath: /scripts
          ports:
            - containerPort: {{ .Values.service.port }}
            - containerPort: {{ .Values.service.portJMX }}
          env:
            - name: OAUTH2_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.OAUTH2_ISSUER_URL }}
            - name: RPD_AUTHORIZATION_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_AUTHORIZATION_URI }}
            - name: RPD_SWAGGER_TOKEN_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_SWAGGER_TOKEN_URI }}
            - name: SWAGGER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SWAGGER_URL }}
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_URL }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_USERNAME }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_PASSWORD }}
            - name: SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SERVER_PORT }}
            - name: KAFKA_BROKERS_LIST_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.KAFKA_BROKERS_LIST_URL }}
            - name: AUDIT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUDIT_URL }}
            - name: RESOURCE_ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RESOURCE_ACCESS }}
            - name: RPD_LIFESPAN_CACHE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_LIFESPAN_CACHE }}
            - name: RPD_REFRESH_TIME_CACHE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_REFRESH_TIME_CACHE }}
            - name: RPD_CONNECTION_TIMEOUT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_CONNECTION_TIMEOUT }}
            - name: RPD_READ_TIMEOUT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RPD_READ_TIMEOUT }}
            - name: DISABLE_TLS_CHECK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.DISABLE_TLS_CHECK }}
            - name: USER_CERTS_ME_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.USER_CERTS_ME_URI }}
            - name: CONTAINER_PART_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONTAINER_PART_URI }}
            - name: ORGANIZATION_FIND_BY_INN_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.ORGANIZATION_FIND_BY_INN_URI }}
            - name: M4D_SOUL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.M4D_SOUL }}
            - name: CRYPTO_PROXY_SIGN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CRYPTO_PROXY_SIGN_URL }}
            - name: AUTOSIGN_USER_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_USER_LOGIN }}
            - name: AUTOSIGN_PINCODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_PINCODE }}
            - name: AUTOSIGN_IS_DETACHED
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_IS_DETACHED }}
            - name: AUTOSIGN_SIG_TYPE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUTOSIGN_SIG_TYPE }}
            - name: SPRING_LIQUIBASE_CONTEXTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_LIQUIBASE_CONTEXTS }}
            - name: FNS_SEND_REGISTRATION_REQUEST_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.FNS_SEND_REGISTRATION_REQUEST_M4D_URI }}
            - name: FNS_SEND_STATUS_REQUEST_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.FNS_SEND_STATUS_REQUEST_M4D_URI }}
            - name: FNS_SEND_REVOKE_REQUEST_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.FNS_SEND_REVOKE_REQUEST_M4D_URI }}
            - name: WHITE_LIST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.WHITE_LIST }}
            - name: ACTUATOR_ENDPOINTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.ACTUATOR_ENDPOINTS }}
            - name: M4D_XML_VERSION_FORMAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.M4D_XML_VERSION_FORMAT }}
            - name: M4D_REVOKE_XML_VERSION_FORMAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.M4D_REVOKE_XML_VERSION_FORMAT }}
            - name: CONFIRM_VERSION_FORMAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_VERSION_FORMAT }}
            - name: CONFIRM_LEGAL_ENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_LEGAL_ENTITY_ID }}
            - name: CONFIRM_LEGAL_ENTITY_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_LEGAL_ENTITY_NAME }}
            - name: CONFIRM_LEGAL_ENTITY_TRADE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_LEGAL_ENTITY_TRADE_NAME }}
            - name: CONFIRM_LEGAL_ENTITY_INN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_LEGAL_ENTITY_INN }}
            - name: CONFIRM_LEGAL_ENTITY_OGRN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_LEGAL_ENTITY_OGRN }}
            - name: CONFIRM_OPERATOR_ADR_NOD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_OPERATOR_ADR_NOD }}
            - name: CONFIRM_OPERATOR_PRODUCT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_OPERATOR_PRODUCT_URL }}
            - name: CONFIRM_OPERATOR_PRODUCT_VERSION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_OPERATOR_PRODUCT_VERSION }}
            - name: CONFIRM_M4D_TYPE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_M4D_TYPE }}
            - name: CONFIRM_REVOKE_TYPE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.CONFIRM_REVOKE_TYPE }}
            - name: SCHEDULER_INTERVAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SCHEDULER_INTERVAL }}
            - name: SCHEDULER_DELAY15
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SCHEDULER_DELAY15 }}
            - name: SCHEDULER_DELAY30
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SCHEDULER_DELAY30 }}
            - name: SCHEDULER_DELAY45
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SCHEDULER_DELAY45 }}
      volumes:
        - name: tls-volume
          configMap:
            name: {{ .Values.tlsConfig.name }}
        - name: workdir
          emptyDir: { }
        - name: setup-script
          configMap:
            name: {{ .Values.scriptConfig.name }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
