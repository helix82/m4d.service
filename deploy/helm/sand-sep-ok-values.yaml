jvmOptions:
  xms: 512m
  xmx: 750m
  gc: "-XX:+UseG1GC"
  minHeapFreeRatio: 10
  maxHeapFreeRatio: 30
  portJMX: 9010
  authenticateJMX: false
  sslJMX: false
  hostnameJMX: localhost
  localOnlyJMX: false
  timezone: UTC
  encoding: UTF-8
  logFilePath: /var/log/pep
  logFileName: m4d.log

jarFile: m4d-0.0.1-SNAPSHOT.jar

