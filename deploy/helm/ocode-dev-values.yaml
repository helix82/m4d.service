jvmOptions:
  xms: 512m
  xmx: 750m
  gc: "-XX:+UseG1GC"
  minHeapFreeRatio: 10
  maxHeapFreeRatio: 30
  portJMX: 9010
  authenticateJMX: false
  sslJMX: false
  hostnameJMX: localhost
  localOnlyJMX: false
  timezone: UTC
  encoding: UTF-8

jarFile: m4d-0.0.1-SNAPSHOT.jar

env:
  SPRING_DATASOURCE_URL: SPRING_DATASOURCE_URL
  SPRING_DATASOURCE_USERNAME: SPRING_DATASOURCE_USERNAME
  SPRING_DATASOURCE_PASSWORD: SPRING_DATASOURCE_PASSWORD
  RPD_AUTHORIZATION_URI: RPD_AUTHORIZATION_URI
  OAUTH2_ISSUER_URL: OAUTH2_ISSUER_URL
  RPD_SWAGGER_TOKEN_URI: RPD_SWAGGER_TOKEN_URI
  KAFKA_BROKERS_LIST_URL: KAFKA_BROKERS_LIST_URL
  SWAGGER_URL: SWAGGER_URL
  M4D_HANDBOOK_URI: M4D_HANDBOOK_URI
  USER_CERTS_ME_URI: USER_CERTS_ME_URI
  CONTAINER_PART_URI: CONTAINER_PART_URI
  CONTAINER_PART_JSON_URI: CONTAINER_PART_JSON_URI
  AUDIT_URL: AUDIT_URL
  SERVER_PORT: SERVER_PORT
  RESOURCE_ACCESS: RESOURCE_ACCESS
  RPD_LIFESPAN_CACHE: RPD_LIFESPAN_CACHE
  RPD_REFRESH_TIME_CACHE: RPD_REFRESH_TIME_CACHE
  RPD_CONNECTION_TIMEOUT: RPD_CONNECTION_TIMEOUT
  RPD_READ_TIMEOUT: RPD_READ_TIMEOUT
  DISABLE_TLS_CHECK: DISABLE_TLS_CHECK
  M4D_API_RR_FNS_URI: M4D_API_RR_FNS_URI
  CONTAINER_CREATE_URI: CONTAINER_CREATE_URI
  ORGANIZATION_CREATE_URI: ORGANIZATION_CREATE_URI
  ORGANIZATION_FIND_BY_INN_URI: ORGANIZATION_FIND_BY_INN_URI
  M4D_SOUL: M4D_SOUL
  CRYPTO_PROXY_SIGN_URL: CRYPTO_PROXY_SIGN_URL
  AUTOSIGN_USER_LOGIN: AUTOSIGN_USER_LOGIN
  AUTOSIGN_PINCODE: AUTOSIGN_PINCODE
  AUTOSIGN_IS_DETACHED: AUTOSIGN_IS_DETACHED
  AUTOSIGN_SIG_TYPE: AUTOSIGN_SIG_TYPE
