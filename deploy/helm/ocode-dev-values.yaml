appName: m4d

deployment:
  container:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      cpu: 400m
      memory: 1Gi

imagePullSecrets:
  - registrypullsecret

resources: {}

liquibase:
  contexts: test