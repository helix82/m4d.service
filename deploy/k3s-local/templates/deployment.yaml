apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapi-deployment
  namespace: {{ .Values.namespace.name }}
  labels:
    app: synapi
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: synapi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  minReadySeconds: 60
  template:
    metadata:
      labels:
        app: synapi
    spec:
      hostAliases:
        {{- range .Values.hostAliases }}
        - ip: {{ .ip }}
          hostnames:
            {{- range .hostnames }}
            - {{ . }}
            {{- end }}
        {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: synapi-pod
          image: {{ .Values.image.repository }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - java
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:{{ .Values.service.portDebug }}
            - -Dspring.profiles.active=k3s-local
            - -Xms2G
            - -Xmx64G
            - -XX:+UseG1GC
            - -XX:MinHeapFreeRatio=10
            - -XX:MaxHeapFreeRatio=30
            - -jar
            - synapi-0.0.1-SNAPSHOT.jar
          ports:
            - containerPort: {{ .Values.service.port }}
            - containerPort: {{ .Values.service.portDebug }}
      imagePullSecrets:
        - name: {{ .Values.secret.name }}
