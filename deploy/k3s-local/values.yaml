namespace:
  enabled: false
  name: master

image:
  repository: nexus.local:5000/repository/seprepo/synapi
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  portDebug: 5005
  targetPortDebug: 5005

replicaCount: 1

resources: {}

ingress:
  enabled: true
  annotations: 
    nginx.ingress.kubernetes.io/proxy-body-size: "51m"
  hosts:
    - host: synapi.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

secret:
  enabled: false
  name: registrypullsecret
  data: "eyJhdXRocyI6eyJuZXh1cy5sb2NhbDo1MDAwIjp7InVzZXJuYW1lIjoiYWRtaW4iLCJwYXNzd29yZCI6InFhejMwMTIxNCJ9fX0="
  type: kubernetes.io/dockerconfigjson

hostAliases:
  - ip: "192.168.1.94"
    hostnames:
      - "keylab"
