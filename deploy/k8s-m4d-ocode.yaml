---
apiVersion: v1
kind: Service
metadata:
  name: postgres-main-m4d
  namespace: ocode-dev
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-main-m4d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-main-m4d
  namespace: ocode-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-main-m4d
  template:
    metadata:
      labels:
        app: postgres-main-m4d
    spec:
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: POSTGRES_DB
          volumeMounts:
            - mountPath: /var/lib/postgresql/data2
              name: postgres-main-m4d-data
      volumes:
        - name: postgres-main-m4d-data
          persistentVolumeClaim:
            claimName: postgres-main-m4d-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-main-m4d-pvc
  namespace: ocode-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: m4d
  namespace: ocode-dev
spec:
  ports:
    - port: 8051
      targetPort: 8051
  selector:
    app: m4d
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: m4d
  namespace: ocode-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m4d
  template:
    metadata:
      labels:
        app: m4d
    spec:
      hostAliases:
        - ip: "10.1.176.210"
          hostnames:
            - "sso.rpd.zk.test.st"
      containers:
        - name: m4d
          image: nexus.essocode.ru/ess/m4d:{{.tag}}
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
            - -Dspring.profiles.active=local
            - -Xms2G
            - -Xmx64G
            - -XX:+UseG1GC
            - -XX:MinHeapFreeRatio=10
            - -XX:MaxHeapFreeRatio=30
            - -jar
            - m4d-0.0.1-SNAPSHOT.jar
          ports:
            - containerPort: 8051
          env:
            - name: OAUTH2_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: OAUTH2_ISSUER_URL
            - name: RPD_AUTHORIZATION_URI
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: RPD_AUTHORIZATION_URI
            - name: RPD_SWAGGER_TOKEN_URI
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: RPD_SWAGGER_TOKEN_URI
            - name: SWAGGER_URL
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: SWAGGER_URL
            - name: KAFKA_BROKERS_LIST_URL
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: KAFKA_BROKERS_LIST_URL
            - name: RPD_STATE_BASE64_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: RPD_STATE_BASE64_SECRET_KEY
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: SPRING_DATASOURCE_PASSWORD
            - name: M4D_HANDBOOK_URI
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: M4D_HANDBOOK_URI
      imagePullSecrets:
        - name: registrypullsecret

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m4d-ingress
  namespace: ocode-dev
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: m4d.essocode.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: m4d
                port:
                  number: 8051
  tls:
    - hosts:
        - m4d.essocode.ru
      secretName: m4d-tls
