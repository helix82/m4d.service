apiVersion: v1
kind: Namespace
metadata:
  name: ocode-dev

---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: m4d-back-cred
  namespace: ocode-dev
data:
  RPD_AUTHORIZATION_URI: aHR0cHM6Ly9zc28ucnBkLnprLnRlc3Quc3QvcmVhbG1zL3Rlc3QvcHJvdG9jb2wvb3BlbmlkLWNvbm5lY3QvYXV0aA==
  OAUTH2_ISSUER_URL: aHR0cHM6Ly9zc28ucnBkLnprLnRlc3Quc3QvcmVhbG1zL3Rlc3Q=
  RPD_SWAGGER_TOKEN_URI: aHR0cHM6Ly9zc28ucnBkLnprLnRlc3Quc3QvcmVhbG1zL3Rlc3QvcHJvdG9jb2wvb3BlbmlkLWNvbm5lY3QvdG9rZW4=
  KAFKA_BROKERS_LIST_URL: a2Fma2ExLmVzc29jb2RlLnJ1OjI5MDkyLGthZmthMi5lc3NvY29kZS5ydTozOTA5Mg==
  SWAGGER_URL: aHR0cHM6Ly9tNGQuZXNzb2NvZGUucnU=
---

apiVersion: v1
kind: Service
metadata:
  name: m4d
  namespace: ocode-dev
spec:
  ports:
    - port: 8051
      targetPort: 8051
  selector:
    app: m4d
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: m4d
  namespace: ocode-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m4d
  template:
    metadata:
      labels:
        app: m4d
    spec:
      hostAliases:
        - ip: "10.1.176.210"
          hostnames:
            - "sso.rpd.zk.test.st"
      containers:
        - name: m4d
          image: nexus.essocode.ru/ess/m4d:{{.tag}}
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
            - -Dspring.profiles.active=local
            - -Xms2G
            - -Xmx64G
            - -XX:+UseG1GC
            - -XX:MinHeapFreeRatio=10
            - -XX:MaxHeapFreeRatio=30
            - -jar
            - m4d-0.0.1-SNAPSHOT.jar
          ports:
            - containerPort: 8051
          env:
            - name: OAUTH2_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: OAUTH2_ISSUER_URL
            - name: RPD_AUTHORIZATION_URI
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: RPD_AUTHORIZATION_URI
            - name: RPD_SWAGGER_TOKEN_URI
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: RPD_SWAGGER_TOKEN_URI
            - name: SWAGGER_URL
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: SWAGGER_URL
            - name: KAFKA_BROKERS_LIST_URL
              valueFrom:
                secretKeyRef:
                  name: m4d-back-cred
                  key: KAFKA_BROKERS_LIST_URL
      imagePullSecrets:
        - name: registrypullsecret

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m4d-ingress
  namespace: ocode-dev
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: m4d.essocode.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: m4d
                port:
                  number: 8051
  tls:
    - hosts:
        - m4d.essocode.ru
      secretName: m4d-tls
