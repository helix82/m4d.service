version: '3.8'

services:

  postgres:
    container_name: postgres
    image: postgres:14
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: m4d_scheme
    healthcheck:
      test: "exit 0"
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata_main:/var/lib/m4d_scheme/data

  app:
    container_name: m4d
    network_mode: "host"
#    extra_hosts:
#      - "sso.rpd.zk.test.st:10.1.176.210"
    build:
      context: ../
      dockerfile: build/Dockerfile
      args:
        NEXUS_RAW_USERNAME: ocode-raw
        NEXUS_RAW_PASSWORD: qqQQ1234
    ports:
      - 8051:8051
      - 8001:8001
      - 5006:5006


