version: '3.8'

services:
  app:
    container_name: synapi
    build:
      context: ../
      dockerfile: build/Dockerfile
      args:
        NEXUS_RAW_USERNAME: ${NEXUS_RAW_USERNAME}
        NEXUS_RAW_PASSWORD: ${NEXUS_RAW_PASSWORD}
    ports:
      - 8080:8080
      - 8000:8000
      - 5005:5005
