kind: pipeline
name: default
type: docker

steps:
  - name: restore-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: cache
        path: /cache
    settings:
      restore: true
      mount:
        - /cache

  - name: build
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      registry: nexus.essocode.ru:5001
      repo: nexus.essocode.ru:5001/ess/m4d
      insecure: true
      cache: true
      tags:
        - latest
        - ${DRONE_SOURCE_BRANCH/\//-}
        - ${DRONE_SOURCE_BRANCH/\//-}-${DRONE_COMMIT}
      cache_from:
        - nexus.essocode.ru:5001/ess/m4d:master
        - nexus.essocode.ru:5001/ess/m4d:${DRONE_SOURCE_BRANCH/\//-}
      dockerfile: ./build/Dockerfile
      username:
        from_secret: docker_login
      password:
        from_secret: docker_pass
      config:
        from_secret: dockerconfig
      build_args:
        from_secret: build_args_nexus
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: cache
        path: /cache
    depends_on:
      - restore-cache

  - name: rebuild-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - /cache
    depends_on:
      - build

