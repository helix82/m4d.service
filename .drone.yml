kind: pipeline
name: default
type: docker

steps:
  - name: restore-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: cache
        path: /cache
    settings:
      restore: true
      mount:
        - /cache

  - name: build
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      registry: nexus.essocode.ru:5001
      repo: nexus.essocode.ru:5001/ess/synapi
      insecure: true
      cache: true
      tags:
        - latest
        - ${DRONE_SOURCE_BRANCH/\//-}
        - ${DRONE_SOURCE_BRANCH/\//-}-${DRONE_COMMIT}
      cache_from:
        - nexus.essocode.ru:5001/ess/synapi:develop
        - nexus.essocode.ru:5001/ess/synapi:${DRONE_SOURCE_BRANCH/\//-}
      dockerfile: ./build/Dockerfile
      username:
        from_secret: docker_login
      password:
        from_secret: docker_pass
      config:
        from_secret: dockerconfig
      build_args:
        from_secret: build_args_nexus
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: cache
        path: /cache
    depends_on:
      - restore-cache

  - name: rebuild-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - /cache
    depends_on:
      - build

  - name: run
    settings:
      insecure: true
    image: nexus.essocode.ru:5001/ess/synapi:${DRONE_SOURCE_BRANCH/\//-}
    volumes:
      - name: out
        path: /out
    pull: always
    detach: true
    commands:
      - cd /app
      - java -Dspring.profiles.active=k3s-ocode -jar synapi-0.0.1-SNAPSHOT.jar
    depends_on:
      - build

  - name: check
    image: curlimages/curl
    environment:
      SYNAPI_URL: http://run
    commands:
      - timeout 60 sh -c 'while ! curl -s -f -o /dev/null $SYNAPI_URL/swagger-ui/index.html#; do sleep 5; done'
    depends_on:
      - run
      - postgres

  - name: deploy
    image: ghcr.io/bh90210/dron8s:latest
    settings:
      yaml: ./deploy/k3s-ocode.yaml
      tag: ${DRONE_SOURCE_BRANCH/\//-}-${DRONE_COMMIT}
      kubeconfig:
        from_secret: kubeconfig
    depends_on:
      - check
    when:
      branch:
        - develop

  - name: save-image-archive
    image: docker
    commands:
      - docker save nexus.essocode.ru:5001/ess/synapi:${DRONE_SOURCE_BRANCH/\//-} | gzip > synapi-${DRONE_SOURCE_BRANCH/\//-}.tar.gz
    volumes:
      - name: out
        path: /out
    depends_on:
      - check
    when:
      branch:
        - release-*

  - name: push-archive-to-gitlab
    image: alpine:3.12
    environment:
      GITLAB_USERNAME:
        from_secret: gitlab_username
      GITLAB_PASSWORD:
        from_secret: gitlab_password
    commands:
      - apk add --no-cache git
      - git config --global user.name "SEP CI"
      - git config --global user.email "sep_user@cifro.tech"
      - git clone https://${GITLAB_USERNAME}:${GITLAB_PASSWORD}@git.cifro.tech/sep/helm-charts.git
      - cd helm-charts
      - git checkout -b sep || git checkout sep
      - mkdir -p image
      - mv /drone/src/synapi-${DRONE_SOURCE_BRANCH/\//-}.tar.gz image/
      - git add image/synapi-${DRONE_SOURCE_BRANCH/\//-}.tar.gz
      - git commit -m "Add Docker image archive for synapi-${DRONE_SOURCE_BRANCH/\//-} in image folder"
      - mkdir -p Helms/k8s-sep-ok-test-st/synapi
      - cp -rv /drone/deploy/k8s-sep-ok-test-st/* Helms/k8s-sep-ok-test-st/synapi/
      - git add Helms/k8s-sep-ok-test-st/synapi/
      - git commit -m "Add Helms charts for k8s-sep-ok-test-st synapi-${DRONE_SOURCE_BRANCH/\//-} in Helms folder"
      - mkdir -p Helms/k8s-sep-zk-test-st/synapi
      - cp -rv /drone/deploy/k8s-sep-zk-test-st/* Helms/k8s-sep-zk-test-st/synapi/
      - git add Helms/k8s-sep-zk-test-st/synapi/
      - git commit -m "Add Helms charts for k8s-sep-zk-test-st synapi-${DRONE_SOURCE_BRANCH/\//-} in Helms folder"
      - git push origin sep
      - rm -f /drone/src/synapi-${DRONE_SOURCE_BRANCH/\//-}.tar.gz
    depends_on:
      - save-image-archive
    when:
      branch:
        - release-*

  - name: notify
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: "{{#success build.status}}✅{{else}}❌{{/success}}  Repository `[{{repo.name}}/{{commit.branch}}]` triggered by event `[{{uppercase build.event}}]` for build.\n    - Commit [[{{commit.sha}}]({{commit.link}})]\n    - Author `[{{commit.author}} / {{commit.email}}]`\n    - Message: {{commit.message}}    - Drone build [[#{{build.number}}]({{build.link}})] reported `[{{uppercase build.status}}]` at `[{{datetime build.finished \"2006.01.02 15:04\" \"\"}}]`\n"
      when:
        status: [ success, failure, changed ]

image_pull_secrets:
  - dockerconfig

node:
  node: 188.120.226.58

trigger:
  event:
    include:
      - push
      - tag
      - pull_request
      - rollback

services:
  - name: postgres
    image: postgres:14.8-alpine3.18
    ports:
      - 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: synapi_test

volumes:
  - name: out
    temp: {}
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: cache
    host:
      path: /tmp/.buildx-cache