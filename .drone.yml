kind: pipeline
name: default
type: docker

steps:
  - name: restore-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: cache
        path: /cache
    settings:
      restore: true
      mount:
        - /cache

  - name: build
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      registry: nexus.essocode.ru:5001
      repo: nexus.essocode.ru:5001/ess/synapi
      insecure: true
      cache: true
      tags:
        - latest
        - ${DRONE_SOURCE_BRANCH/\//-}
        - ${DRONE_SOURCE_BRANCH/\//-}-${DRONE_COMMIT}
      cache_from:
        - nexus.essocode.ru:5001/ess/synapi:develop
        - nexus.essocode.ru:5001/ess/synapi:${DRONE_SOURCE_BRANCH/\//-}
      dockerfile: Dockerfile
      username:
        from_secret: docker_login
      password:
        from_secret: docker_pass
      config:
        from_secret: dockerconfig
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: cache
        path: /cache

  - name: rebuild-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - /cache

  - name: run
    settings:
      insecure: true
    image: nexus.essocode.ru:5001/ess/synapi:${DRONE_SOURCE_BRANCH/\//-}
    volumes:
      - name: out
        path: /out
    pull: always
    detach: true
    commands:
      - cd /app
      - java -Dspring.profiles.active=k8s -jar synapi-0.0.1-SNAPSHOT.jar
    depends_on:
      - build

  - name: check
    image: curlimages/curl
    environment:
      SYNAPI_URL: http://synapi
    commands:
      - while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' $SYNAPI_URL/swagger-ui/index.html#)" != "200" ]]; do sleep 5; done
    depends_on:
      - run
      - postgres

  - name: deploy
    image: ghcr.io/bh90210/dron8s:latest
    settings:
      yaml: ./k8s-synapi-ocode-dev.yaml
      tag: ${DRONE_SOURCE_BRANCH/\//-}-${DRONE_COMMIT}
      kubeconfig:
        from_secret: kubeconfig
    depends_on:
      - check
    when:
      branch:
        - develop

  - name: notify
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: "{{#success build.status}}✅{{else}}❌{{/success}}  Repository `[{{repo.name}}/{{commit.branch}}]` triggered by event `[{{uppercase build.event}}]` for build.\n    - Commit [[{{commit.sha}}]({{commit.link}})]\n    - Author `[{{commit.author}} / {{commit.email}}]`\n    - Message: {{commit.message}}    - Drone build [[#{{build.number}}]({{build.link}})] reported `[{{uppercase build.status}}]` at `[{{datetime build.finished \"2006.01.02 15:04\" \"\"}}]`\n"
      when:
        status: [ success, failure, changed ]

image_pull_secrets:
  - dockerconfig

node:
  node: 188.120.226.58

trigger:
  event:
    include:
      - push
      - tag
      - pull_request
      - rollback

services:
  - name: postgres
    image: postgres:14.8-alpine3.18
    ports:
      - 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: synapi_test

volumes:
  - name: out
    temp: {}
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: cache
    host:
      path: /tmp/.buildx-cache