apiVersion: v1
kind: Namespace
metadata:
  name: ocode-dev

---

apiVersion: v1
kind: Service
metadata:
  name: synapi-ocode-dev-service
  namespace: ocode-dev
spec:
  selector:
    app: synapi-ocode-dev
  ports:
    - name: http
      port: 80
      targetPort: 80
    - protocol: TCP
      port: 5005
      targetPort: 5005
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapi-ocode-dev-deployment
  namespace: ocode-dev
  labels:
    app: synapi-ocode-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapi-ocode-dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  minReadySeconds: 60
  template:
    metadata:
      labels:
        app: synapi-ocode-dev
    spec:
      hostAliases:
        - ip: "10.8.0.13"
          hostnames:
            - "keylab"
      terminationGracePeriodSeconds: 30
      containers:
        - name: synapi-dev
          image: nexus.essocode.ru/ess/synapi:{{.tag}}
          imagePullPolicy: "Always"
          command:
            - java
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
            - -Dspring.profiles.active=k8s
            - -Xms2G
            - -Xmx64G
            - -XX:+UseG1GC
            - -XX:MinHeapFreeRatio=10
            - -XX:MaxHeapFreeRatio=30
            - -jar
            - synapi-0.0.1-SNAPSHOT.jar
          ports:
            - containerPort: 80
            - containerPort: 5005
      imagePullSecrets:
        - name: registrypullsecret

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapi-ocode-dev-ingress
  namespace: ocode-dev
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "51m"
spec:
  ingressClassName: nginx
  rules:
    - host: sp.essocode.ru
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: synapi-ocode-dev-service
                port:
                  number: 80

  tls:
    - hosts:
        - sp.essocode.ru
      secretName: synapi-ocode-dev-tls
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-services
  namespace: ingress-nginx
data:
  5005: "ocode-dev/synapi-ocode-dev-service:5005"